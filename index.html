<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luyện nói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5efe1;
    --bg-soft: #fbf7ec;
    --sidebar-bg: #2a2420;
    --sidebar-active: #3c332b;
    --sidebar-text: #cabfae;
    --sidebar-text-dim: #8f8575;
    --line: #e3d7bb;
    --line-strong: #d5c49c;
    --ink: #2a2420;
    --ink-dim: #7d7364;
    --ink-faint: #a89d89;
    --gold: #a97d3f;
    --gold-soft: #f0e0bc;
    --gold-dim: #c9ab74;
    --dark: #221d19;
    --red: #ac4d3a;
    --red-soft: #f4ddd6;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Work Sans', system-ui, sans-serif;
    --serif: 'Playfair Display', Georgia, serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection{ background: var(--gold-soft); color: var(--ink); }

  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  button{
    font-family: inherit;
    cursor: pointer;
  }

  /* ---------- App shell ---------- */
  .app-shell{
    display: flex;
    min-height: 100vh;
  }

  .sidebar{
    width: 246px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
  }
  .brand-name{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: #e8ddc9;
  }
  .brand-rule{
    height: 2px;
    width: 56px;
    background: var(--gold-dim);
    margin: 16px 0 28px;
  }
  .side-nav{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-item{
    display: flex;
    align-items: center;
    gap: 11px;
    background: none;
    border: none;
    color: var(--sidebar-text);
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-family: var(--sans);
  }
  .nav-item .nav-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    flex-shrink: 0;
  }
  .nav-item:hover{
    background: rgba(255,255,255,0.05);
    color: #e8ddc9;
  }
  .nav-item.active{
    background: var(--sidebar-active);
    color: var(--gold-dim);
    font-weight: 600;
  }
  .nav-item.active .nav-dot{
    background: var(--gold-dim);
    border-color: var(--gold-dim);
  }
  .nav-count{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    opacity: 0.75;
  }

  .content{
    flex: 1;
    min-width: 0;
    padding: 44px 52px 110px;
    max-width: 920px;
  }

  .page-header{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 32px;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .page-title{
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    line-height: 1.1;
  }
  .btn-dark-pill{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-dark-pill:hover{ background: #33291f; }

  @media (max-width: 860px){
    .app-shell{ flex-direction: column; }
    .sidebar{
      width: 100%;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      padding: 16px 20px;
    }
    .brand-rule{ display: none; }
    .side-nav{
      flex-direction: row;
      overflow-x: auto;
      gap: 6px;
    }
    .nav-item{ padding: 9px 12px; font-size: 13.5px; white-space: nowrap; }
    .content{ padding: 28px 20px 90px; }
    .page-title{ font-size: 28px; }
  }

  .view{ display: none; }
  .view.active{ display: block; }

  /* ---------- Questions tab ---------- */
  .panel{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  .panel + .panel{ margin-top: 18px; }

  .field{ margin-bottom: 16px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .field textarea, .field input[type="text"]{
    width: 100%;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .field textarea{ min-height: 56px; }
  .field textarea:focus, .field input:focus{
    border-color: var(--gold);
  }

  .row2{
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
  }
  @media (max-width: 560px){
    .row2{ grid-template-columns: 1fr; }
  }

  .row2-even{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 560px){
    .row2-even{ grid-template-columns: 1fr; }
  }
  .field input[type="date"]{
    width: 100%;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
  }
  .field input[type="date"]:focus{ border-color: var(--gold); }

  .support-item{
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 14px 14px 4px;
    margin-bottom: 10px;
    position: relative;
  }
  .support-item .remove-support{
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
  }
  .support-item .remove-support:hover{ color: var(--red); }

  .add-support-btn{
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 7px 16px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .add-support-btn:hover{ background: var(--gold-soft); }

  .form-actions{
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-primary{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary:hover{ background: #33291f; }
  .btn-ghost{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 11px 18px;
    font-size: 14px;
  }
  .btn-ghost:hover{ color: var(--ink); border-color: var(--ink-faint); }

  .qlist-title{
    font-size: 12px;
    color: var(--ink-faint);
    margin: 0;
    letter-spacing: 0.02em;
  }

  .list-toolbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 26px 0 10px;
  }
  .list-controls{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tag-search-wrap{
    position: relative;
  }
  .tag-search-wrap input{
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    min-width: 190px;
  }
  .tag-search-wrap input:focus{ border-color: var(--gold); }
  .tag-dropdown{
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 24px rgba(42,36,32,0.14);
    max-height: 190px;
    overflow-y: auto;
    z-index: 30;
  }
  .tag-dropdown.open{ display: block; }
  .tag-option{
    padding: 8px 14px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .tag-option:hover{ background: var(--gold-soft); color: var(--ink); }
  .sort-btn{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 13px;
    white-space: nowrap;
  }
  .sort-btn:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .qcard{
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .qcard-head{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 14px;
  }
  .qcard-date{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    min-width: 46px;
  }
  .qcard-q{
    font-size: 14px;
    color: var(--ink);
    flex: 1 1 200px;
    min-width: 150px;
    cursor: pointer;
  }
  .qcard-tags{
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex-shrink: 0;
    max-width: 240px;
    justify-content: flex-end;
  }
  .tag-chip{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    padding: 2px 9px;
    white-space: nowrap;
  }
  .qcard-actions{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn{
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 4px 7px;
    border-radius: 6px;
  }
  .icon-btn:hover{ color: var(--ink); background: var(--line); }
  .icon-btn.danger:hover{ color: var(--red); }

  .qcard-body{
    display: none;
    padding: 14px;
    font-size: 13px;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
  }
  .qcard-body.open{ display: block; }
  .qcard-body .block{ margin-bottom: 12px; }
  .qcard-body .block:last-child{ margin-bottom: 0; }
  .block-label{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .chip{
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid var(--gold-dim);
    border-radius: var(--radius-pill);
    padding: 2px 10px;
    margin: 0 4px 4px 0;
  }
  .ref-text{ color: var(--ink); }

  .empty-note{
    color: var(--ink-faint);
    font-size: 13px;
    padding: 20px 4px;
    text-align: center;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
  }

  /* ---------- Practice tab ---------- */
  .stage{
    text-align: center;
    padding: 10px 0 6px;
  }

  .stage-question{
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-soft);
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 26px;
  }
  .stage-question.placeholder{ color: var(--ink-faint); font-size: 14px; }

  .random-btn{
    display: block;
    margin: 0 auto 34px;
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
  }
  .random-btn:hover{ background: var(--gold-soft); }
  .random-btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }

  .timer-display{
    font-family: var(--mono);
    font-weight: 600;
    font-size: clamp(64px, 18vw, 108px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 30px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
  }
  .timer-display.warn{ color: var(--gold); }
  .timer-display.done{ color: var(--red); }

  .duration-group{
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .duration-btn{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 9px 20px;
    font-size: 14px;
  }
  .duration-btn.active{
    background: var(--dark);
    color: #f5efe1;
    border-color: var(--dark);
  }
  .duration-btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .control-group{
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn-start{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 13px 36px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-start:hover{ background: #33291f; }
  .btn-start:disabled{ opacity: 0.35; cursor: not-allowed; background: var(--dark); }

  .btn-stop{
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: var(--radius-pill);
    padding: 13px 36px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-stop:hover{ background: var(--red-soft); }
  .btn-stop:disabled{ opacity: 0.35; cursor: not-allowed; }

  .status-line{
    text-align:center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 18px;
    min-height: 16px;
  }

  .divider{
    border: none;
    border-top: 1px solid var(--line);
    margin: 34px 0 26px;
  }

  .hint-section{
    text-align: left;
  }
  .hint-buttons{
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .btn-hint{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 9px 18px;
    font-size: 13px;
  }
  .btn-hint:hover{ border-color: var(--ink-faint); color: var(--ink); }
  .btn-hint.active{ border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .btn-hint:disabled{ opacity: 0.4; cursor: not-allowed; }

  .reveal-area{
    max-width: 560px;
    margin: 0 auto;
  }
  .reveal-item{
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .reveal-item .block-label{ margin-bottom: 6px; }
  .reveal-item .ref-text{
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-dim);
  }

  .finish-group{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }
  .btn-complete{
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-complete:hover{ background: var(--gold-soft); }
  .btn-complete:disabled{ opacity: 0.35; cursor: not-allowed; }
  .btn-skip{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font-size: 14px;
  }
  .btn-skip:hover{ color: var(--ink); border-color: var(--ink-faint); }
  .btn-skip:disabled{ opacity: 0.35; cursor: not-allowed; }

  /* ---------- History tab ---------- */
  .history-toolbar{
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .hist-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .hist-main{ flex: 1; min-width: 0; }
  .hist-question{
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .hist-meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .badge{
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .badge.completed{
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    background: var(--gold-soft);
  }
  .badge.skipped{
    color: var(--ink-faint);
    border: 1px solid var(--line-strong);
  }

  /* ---------- Report tab ---------- */
  .report-summary{
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .summary-card{
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
    background: var(--bg-soft);
  }
  .summary-num{
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
  }
  .summary-label{
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .report-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .report-table th{
    text-align: left;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--ink-faint);
    font-weight: 500;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .report-table td{
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
    vertical-align: top;
  }
  .report-table tr:last-child td{ border-bottom: none; }
  .report-table td.q-cell{ color: var(--ink); }
  .report-table td.num-cell{
    font-family: var(--mono);
    text-align: center;
  }
  .bar-track{
    background: var(--line);
    border-radius: var(--radius-pill);
    height: 5px;
    margin-top: 6px;
    overflow: hidden;
  }
  .bar-fill{
    background: var(--gold);
    height: 100%;
  }
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-name">LUYỆN NÓI</div>
    <div class="brand-rule"></div>
    <nav class="side-nav">
      <button class="nav-item active" data-tab="questions"><span class="nav-dot"></span>Câu hỏi<span class="nav-count" id="qCount">0</span></button>
      <button class="nav-item" data-tab="practice"><span class="nav-dot"></span>Luyện tập</button>
      <button class="nav-item" data-tab="history"><span class="nav-dot"></span>Lịch sử</button>
      <button class="nav-item" data-tab="report"><span class="nav-dot"></span>Báo cáo</button>
    </nav>
  </aside>

  <main class="content">

    <div class="page-header">
      <div>
        <div class="eyebrow" id="pageEyebrow">BỘ CÂU HỎI CỦA BẠN</div>
        <h1 class="page-title" id="pageTitle">Câu hỏi</h1>
      </div>
      <button class="btn-dark-pill" id="headerActionBtn">+ Thêm câu hỏi</button>
    </div>

    <!-- ================= QUESTIONS TAB ================= -->
    <div class="view active" id="view-questions">

      <div class="panel">
        <form id="qForm">
          <div class="field">
            <label for="fQuestion">Câu hỏi</label>
            <textarea id="fQuestion" required placeholder="Tại sao...?"></textarea>
          </div>

          <div class="field">
            <label>Thông điệp cốt lõi (answer first)</label>
            <div class="row2">
              <input type="text" id="fCoreKeyword" placeholder="Từ khóa" />
              <textarea id="fCoreRef" placeholder="Gợi ý tham khảo"></textarea>
            </div>
          </div>

          <div class="field">
            <label>Các ý support</label>
            <div id="supportList"></div>
            <button type="button" class="add-support-btn" id="addSupportBtn">+ Thêm ý support</button>
          </div>

          <div class="field">
            <label>Tag &amp; ngày upload</label>
            <div class="row2-even">
              <input type="text" id="fTag" placeholder="Tag, phân cách bằng dấu phẩy" />
              <input type="date" id="fUploadDate" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="saveBtn">Lưu câu hỏi</button>
            <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none;">Hủy chỉnh sửa</button>
          </div>
        </form>
      </div>

      <div class="list-toolbar">
        <div class="qlist-title">Danh sách đã lưu</div>
        <div class="list-controls">
          <div class="tag-search-wrap">
            <input type="text" id="tagSearchInput" placeholder="Tìm theo tag..." autocomplete="off" />
            <div class="tag-dropdown" id="tagDropdown"></div>
          </div>
          <button type="button" class="sort-btn" id="sortBtn">Ngày upload: Mới nhất ↓</button>
        </div>
      </div>
      <div id="qList"></div>

    </div>

    <!-- ================= PRACTICE TAB ================= -->
    <div class="view" id="view-practice">

      <div class="stage">
        <div class="stage-question placeholder" id="stageQuestion">Bấm "Random câu hỏi" để bắt đầu</div>

        <button class="random-btn" id="randomBtn">🎲 Random câu hỏi</button>

        <div class="timer-display" id="timerDisplay">07</div>

        <div class="duration-group" id="durationGroup">
          <button class="duration-btn active" data-secs="7">7s</button>
          <button class="duration-btn" data-secs="15">15s</button>
          <button class="duration-btn" data-secs="30">30s</button>
        </div>

        <div class="control-group">
          <button class="btn-start" id="startBtn">Bắt đầu</button>
          <button class="btn-stop" id="stopBtn" disabled>Dừng</button>
        </div>

        <div class="status-line" id="statusLine"></div>

        <hr class="divider" />

        <div class="hint-section">
          <div class="hint-buttons">
            <button class="btn-hint" id="keywordBtn" disabled>Xem key words</button>
            <button class="btn-hint" id="samplesBtn" disabled>Xem samples</button>
          </div>
          <div class="reveal-area" id="revealArea"></div>
        </div>

        <div class="finish-group">
          <button class="btn-complete" id="completeBtn" disabled>✓ Hoàn thành luyện tập</button>
          <button class="btn-skip" id="skipBtn" disabled>Bỏ qua</button>
        </div>
      </div>

    </div>

    <!-- ================= HISTORY TAB ================= -->
    <div class="view" id="view-history">
      <div class="history-toolbar">
        <button class="btn-ghost" id="clearHistoryBtn">Xóa lịch sử</button>
      </div>
      <div id="historyList"></div>
    </div>

    <!-- ================= REPORT TAB ================= -->
    <div class="view" id="view-report">
      <div class="report-summary" id="reportSummary"></div>
      <div id="reportTableWrap"></div>
    </div>

  </main>

</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "speech-practice-questions-v1";

  /* ---------------- Data layer ---------------- */
  function loadQuestions(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Không đọc được dữ liệu đã lưu:", e);
      return [];
    }
  }
  function saveQuestions(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){
      console.error("Không lưu được dữ liệu:", e);
      alert("Không thể lưu dữ liệu (bộ nhớ trình duyệt có thể đã đầy hoặc bị chặn).");
    }
  }

  let questions = loadQuestions();
  let editingId = null;

  const HISTORY_KEY = "speech-practice-history-v1";
  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Không đọc được lịch sử:", e);
      return [];
    }
  }
  function saveHistory(list){
    try{
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }catch(e){
      console.error("Không lưu được lịch sử:", e);
    }
  }
  let history = loadHistory();

  /* ---------------- Tabs / page header ---------------- */
  const pageHeaders = {
    questions: { eyebrow: "BỘ CÂU HỎI CỦA BẠN", title: "Câu hỏi", action: true },
    practice: { eyebrow: "CHẾ ĐỘ LUYỆN TẬP", title: "Luyện tập", action: false },
    history: { eyebrow: "NHẬT KÝ LUYỆN TẬP", title: "Lịch sử", action: false },
    report: { eyebrow: "THỐNG KÊ", title: "Báo cáo", action: false }
  };

  const pageEyebrow = document.getElementById("pageEyebrow");
  const pageTitle = document.getElementById("pageTitle");
  const headerActionBtn = document.getElementById("headerActionBtn");

  const tabBtns = document.querySelectorAll(".nav-item");
  const views = {
    questions: document.getElementById("view-questions"),
    practice: document.getElementById("view-practice"),
    history: document.getElementById("view-history"),
    report: document.getElementById("view-report")
  };

  function activateTab(tabKey){
    tabBtns.forEach(b=> b.classList.toggle("active", b.dataset.tab === tabKey));
    Object.entries(views).forEach(([key, el])=> el.classList.toggle("active", key === tabKey));
    const h = pageHeaders[tabKey];
    pageEyebrow.textContent = h.eyebrow;
    pageTitle.textContent = h.title;
    headerActionBtn.style.display = h.action ? "inline-block" : "none";
    if(tabKey === "history") renderHistory();
    if(tabKey === "report") renderReport();
  }

  tabBtns.forEach(btn=>{
    btn.addEventListener("click", ()=> activateTab(btn.dataset.tab));
  });

  headerActionBtn.addEventListener("click", ()=>{
    resetForm();
    document.getElementById("fQuestion").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ---------------- Support rows (form) ---------------- */
  const supportListEl = document.getElementById("supportList");
  const addSupportBtn = document.getElementById("addSupportBtn");

  function makeSupportRow(data){
    data = data || { keyword: "", ref: "" };
    const row = document.createElement("div");
    row.className = "support-item";
    row.innerHTML = `
      <button type="button" class="remove-support" aria-label="Xóa ý support">×</button>
      <div class="row2">
        <input type="text" class="sup-keyword" placeholder="Từ khóa" value="${escapeAttr(data.keyword)}" />
        <textarea class="sup-ref" placeholder="Gợi ý tham khảo">${escapeHtml(data.ref)}</textarea>
      </div>
    `;
    row.querySelector(".remove-support").addEventListener("click", ()=> row.remove());
    supportListEl.appendChild(row);
  }

  addSupportBtn.addEventListener("click", ()=> makeSupportRow());

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function todayISO(){
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function formatDateStr(s){
    if(!s) return "—";
    const parts = s.split("-");
    if(parts.length !== 3) return s;
    return `${parts[2]}/${parts[1]}`;
  }

  /* ---------------- Form submit / reset ---------------- */
  const qForm = document.getElementById("qForm");
  const fQuestion = document.getElementById("fQuestion");
  const fCoreKeyword = document.getElementById("fCoreKeyword");
  const fCoreRef = document.getElementById("fCoreRef");
  const fTag = document.getElementById("fTag");
  const fUploadDate = document.getElementById("fUploadDate");
  const saveBtn = document.getElementById("saveBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");

  function resetForm(){
    qForm.reset();
    supportListEl.innerHTML = "";
    editingId = null;
    fUploadDate.value = todayISO();
    saveBtn.textContent = "Lưu câu hỏi";
    cancelEditBtn.style.display = "none";
  }

  qForm.addEventListener("submit", (e)=>{
    e.preventDefault();
    const questionText = fQuestion.value.trim();
    if(!questionText){ return; }

    const supports = Array.from(supportListEl.querySelectorAll(".support-item")).map(row=>({
      keyword: row.querySelector(".sup-keyword").value.trim(),
      ref: row.querySelector(".sup-ref").value.trim()
    })).filter(s => s.keyword || s.ref);

    const record = {
      id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      question: questionText,
      coreKeyword: fCoreKeyword.value.trim(),
      coreRef: fCoreRef.value.trim(),
      supports,
      tags: fTag.value.split(",").map(t=>t.trim()).filter(Boolean),
      uploadDate: fUploadDate.value || todayISO()
    };

    if(editingId){
      const idx = questions.findIndex(q=>q.id===editingId);
      if(idx > -1) questions[idx] = record;
    } else {
      questions.push(record);
    }

    saveQuestions(questions);
    resetForm();
    renderList();
  });

  cancelEditBtn.addEventListener("click", resetForm);

  /* ---------------- List rendering ---------------- */
  const qList = document.getElementById("qList");
  const qCount = document.getElementById("qCount");
  const sortBtn = document.getElementById("sortBtn");
  const tagSearchInput = document.getElementById("tagSearchInput");
  const tagDropdown = document.getElementById("tagDropdown");
  const tagSearchWrap = document.querySelector(".tag-search-wrap");

  let sortOrder = "newest";
  let tagFilter = "";

  function getAllTags(){
    const set = new Set();
    questions.forEach(q => (q.tags||[]).forEach(t => set.add(t)));
    return Array.from(set).sort((a,b)=> a.localeCompare(b));
  }

  sortBtn.addEventListener("click", ()=>{
    sortOrder = sortOrder === "newest" ? "oldest" : "newest";
    sortBtn.textContent = sortOrder === "newest" ? "Ngày upload: Mới nhất ↓" : "Ngày upload: Cũ nhất ↑";
    renderList();
  });

  function hideTagDropdown(){ tagDropdown.classList.remove("open"); }

  function renderTagDropdown(){
    const val = tagSearchInput.value.trim().toLowerCase();
    if(!val){ hideTagDropdown(); tagDropdown.innerHTML = ""; return; }
    const matches = getAllTags().filter(t => t.toLowerCase().includes(val));
    if(matches.length === 0){ hideTagDropdown(); tagDropdown.innerHTML = ""; return; }
    tagDropdown.innerHTML = matches.map(t=>`<div class="tag-option" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</div>`).join("");
    tagDropdown.classList.add("open");
    tagDropdown.querySelectorAll(".tag-option").forEach(opt=>{
      opt.addEventListener("click", ()=>{
        tagSearchInput.value = opt.dataset.tag;
        tagFilter = opt.dataset.tag;
        hideTagDropdown();
        renderList();
      });
    });
  }

  tagSearchInput.addEventListener("input", ()=>{
    tagFilter = tagSearchInput.value.trim();
    renderTagDropdown();
    renderList();
  });
  tagSearchInput.addEventListener("focus", renderTagDropdown);
  document.addEventListener("click", (e)=>{
    if(!tagSearchWrap.contains(e.target)) hideTagDropdown();
  });

  function renderList(){
    qCount.textContent = questions.length;

    let filtered = questions;
    if(tagFilter){
      const needle = tagFilter.toLowerCase();
      filtered = filtered.filter(q => (q.tags||[]).some(t => t.toLowerCase().includes(needle)));
    }
    filtered = [...filtered].sort((a,b)=>{
      const da = a.uploadDate || "";
      const db = b.uploadDate || "";
      return sortOrder === "newest" ? db.localeCompare(da) : da.localeCompare(db);
    });

    qList.innerHTML = "";

    if(questions.length === 0){
      qList.innerHTML = `<div class="empty-note">Chưa có câu hỏi nào. Thêm câu hỏi đầu tiên ở form phía trên.</div>`;
      return;
    }
    if(filtered.length === 0){
      qList.innerHTML = `<div class="empty-note">Không tìm thấy câu hỏi nào với tag "${escapeHtml(tagFilter)}".</div>`;
      return;
    }

    filtered.forEach(q=>{
      const card = document.createElement("div");
      card.className = "qcard";

      const supportsHtml = q.supports.map((s, i)=>`
        <div class="block">
          <div class="block-label">Giải thích ${i+1}</div>
          ${s.keyword ? `<span class="chip">${escapeHtml(s.keyword)}</span>` : ""}
          ${s.ref ? `<div class="ref-text">${escapeHtml(s.ref)}</div>` : ""}
        </div>
      `).join("");

      const tagsHtml = (q.tags||[]).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join("");

      card.innerHTML = `
        <div class="qcard-head">
          <div class="qcard-date">${formatDateStr(q.uploadDate)}</div>
          <div class="qcard-q">${escapeHtml(q.question)}</div>
          <div class="qcard-tags">${tagsHtml}</div>
          <div class="qcard-actions">
            <button class="icon-btn edit-btn" title="Sửa">Sửa</button>
            <button class="icon-btn danger delete-btn" title="Xóa">Xóa</button>
          </div>
        </div>
        <div class="qcard-body">
          <div class="block">
            <div class="block-label">Thông điệp cốt lõi</div>
            ${q.coreKeyword ? `<span class="chip">${escapeHtml(q.coreKeyword)}</span>` : ""}
            ${q.coreRef ? `<div class="ref-text">${escapeHtml(q.coreRef)}</div>` : ""}
          </div>
          ${supportsHtml}
        </div>
      `;

      card.querySelector(".qcard-q").addEventListener("click", ()=>{
        card.querySelector(".qcard-body").classList.toggle("open");
      });
      card.querySelector(".edit-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        startEdit(q.id);
      });
      card.querySelector(".delete-btn").addEventListener("click", (e)=>{
        e.stopPropagation();
        if(confirm("Xóa câu hỏi này?")){
          questions = questions.filter(x=>x.id !== q.id);
          saveQuestions(questions);
          renderList();
        }
      });

      qList.appendChild(card);
    });
  }

  function startEdit(id){
    const q = questions.find(x=>x.id===id);
    if(!q) return;
    editingId = id;
    fQuestion.value = q.question;
    fCoreKeyword.value = q.coreKeyword || "";
    fCoreRef.value = q.coreRef || "";
    fTag.value = (q.tags||[]).join(", ");
    fUploadDate.value = q.uploadDate || todayISO();
    supportListEl.innerHTML = "";
    q.supports.forEach(s => makeSupportRow(s));
    saveBtn.textContent = "Cập nhật câu hỏi";
    cancelEditBtn.style.display = "inline-block";
    activateTab("questions");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- Practice tab ---------------- */
  const stageQuestion = document.getElementById("stageQuestion");
  const randomBtn = document.getElementById("randomBtn");
  const timerDisplay = document.getElementById("timerDisplay");
  const durationGroup = document.getElementById("durationGroup");
  const durationBtns = durationGroup.querySelectorAll(".duration-btn");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusLine = document.getElementById("statusLine");
  const keywordBtn = document.getElementById("keywordBtn");
  const samplesBtn = document.getElementById("samplesBtn");
  const revealArea = document.getElementById("revealArea");
  const completeBtn = document.getElementById("completeBtn");
  const skipBtn = document.getElementById("skipBtn");

  let selectedDuration = 7;
  let remaining = selectedDuration;
  let intervalId = null;
  let lastQuestionId = null;
  let currentQuestion = null;
  let revealSequence = [];
  let revealedCount = 0;
  let samplesVisible = false;

  function formatTime(s){
    return String(s).padStart(2, "0");
  }

  function updateTimerDisplay(){
    timerDisplay.textContent = formatTime(remaining);
    timerDisplay.classList.remove("warn", "done");
    if(remaining === 0){
      timerDisplay.classList.add("done");
    } else if(remaining <= Math.max(2, Math.round(selectedDuration * 0.25))){
      timerDisplay.classList.add("warn");
    }
  }

  durationBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(intervalId) return;
      durationBtns.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      selectedDuration = parseInt(btn.dataset.secs, 10);
      remaining = selectedDuration;
      updateTimerDisplay();
      statusLine.textContent = "";
    });
  });

  randomBtn.addEventListener("click", ()=>{
    if(questions.length === 0){
      stageQuestion.textContent = "Chưa có câu hỏi nào — hãy thêm ở tab \"Câu hỏi\" trước.";
      stageQuestion.classList.add("placeholder");
      return;
    }
    let pick;
    if(questions.length === 1){
      pick = questions[0];
    } else {
      do{
        pick = questions[Math.floor(Math.random() * questions.length)];
      } while(pick.id === lastQuestionId);
    }
    lastQuestionId = pick.id;
    currentQuestion = pick;
    stageQuestion.textContent = pick.question;
    stageQuestion.classList.remove("placeholder");
    loadRevealSequence(pick);
    completeBtn.disabled = false;
    skipBtn.disabled = false;
    statusLine.textContent = "";
  });

  /* ---------------- Gợi ý: key words & samples ---------------- */
  function buildSequence(q){
    const seq = [];
    if(q.coreKeyword || q.coreRef){
      seq.push({ label: "Thông điệp cốt lõi", keyword: q.coreKeyword, ref: q.coreRef });
    }
    (q.supports || []).forEach((s, i)=>{
      if(s.keyword || s.ref){
        seq.push({ label: "Ý support " + (i+1), keyword: s.keyword, ref: s.ref });
      }
    });
    return seq;
  }

  function loadRevealSequence(q){
    revealSequence = buildSequence(q);
    revealedCount = 0;
    samplesVisible = false;
    renderReveal();
  }

  function renderReveal(){
    const total = revealSequence.length;

    if(total === 0){
      keywordBtn.disabled = true;
      keywordBtn.textContent = "Xem key words";
      samplesBtn.disabled = true;
      samplesBtn.textContent = "Xem samples";
      revealArea.innerHTML = "";
      return;
    }

    keywordBtn.disabled = revealedCount >= total;
    keywordBtn.textContent = revealedCount === 0 ? "Xem key words"
      : (revealedCount >= total ? "Đã hiện hết" : "Xem tiếp");

    samplesBtn.disabled = revealedCount === 0;
    samplesBtn.classList.toggle("active", samplesVisible);
    samplesBtn.textContent = samplesVisible ? "Ẩn samples" : "Xem samples";

    revealArea.innerHTML = "";
    for(let i=0; i<revealedCount; i++){
      const item = revealSequence[i];
      const div = document.createElement("div");
      div.className = "reveal-item";
      div.innerHTML = `
        <div class="block-label">${escapeHtml(item.label)}</div>
        ${item.keyword ? `<span class="chip">${escapeHtml(item.keyword)}</span>` : ""}
        ${samplesVisible && item.ref ? `<div class="ref-text">${escapeHtml(item.ref)}</div>` : ""}
      `;
      revealArea.appendChild(div);
    }
  }

  keywordBtn.addEventListener("click", ()=>{
    if(revealedCount >= revealSequence.length) return;
    revealedCount += 1;
    renderReveal();
  });

  samplesBtn.addEventListener("click", ()=>{
    if(revealedCount === 0) return;
    samplesVisible = !samplesVisible;
    renderReveal();
  });

  /* ---------------- Hoàn thành / Bỏ qua ---------------- */
  function logAttempt(result){
    if(!currentQuestion) return;
    history.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      questionId: currentQuestion.id,
      question: currentQuestion.question,
      duration: selectedDuration,
      result: result,
      timestamp: Date.now()
    });
    saveHistory(history);

    if(intervalId){
      clearInterval(intervalId);
      intervalId = null;
    }
    setRunningState(false);
    remaining = selectedDuration;
    updateTimerDisplay();

    currentQuestion = null;
    stageQuestion.textContent = "Bấm \"Random câu hỏi\" để tiếp tục";
    stageQuestion.classList.add("placeholder");
    completeBtn.disabled = true;
    skipBtn.disabled = true;
    loadRevealSequence({ coreKeyword:"", coreRef:"", supports: [] });
    statusLine.textContent = result === "completed" ? "Đã ghi nhận: Hoàn thành." : "Đã ghi nhận: Bỏ qua.";
  }

  completeBtn.addEventListener("click", ()=> logAttempt("completed"));
  skipBtn.addEventListener("click", ()=> logAttempt("skipped"));

  function setRunningState(running){
    startBtn.disabled = running;
    stopBtn.disabled = !running;
    randomBtn.disabled = running;
    durationBtns.forEach(b=> b.disabled = running);
  }

  startBtn.addEventListener("click", ()=>{
    if(intervalId) return;
    remaining = selectedDuration;
    updateTimerDisplay();
    setRunningState(true);
    statusLine.textContent = "Đang nói...";

    intervalId = setInterval(()=>{
      remaining -= 1;
      updateTimerDisplay();
      if(remaining <= 0){
        clearInterval(intervalId);
        intervalId = null;
        setRunningState(false);
        statusLine.textContent = "Hết giờ.";
      }
    }, 1000);
  });

  stopBtn.addEventListener("click", ()=>{
    if(intervalId){
      clearInterval(intervalId);
      intervalId = null;
    }
    remaining = selectedDuration;
    updateTimerDisplay();
    setRunningState(false);
    statusLine.textContent = "Đã dừng.";
  });

  /* ---------------- History tab ---------------- */
  const historyList = document.getElementById("historyList");
  const clearHistoryBtn = document.getElementById("clearHistoryBtn");

  function formatDateTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderHistory(){
    if(history.length === 0){
      historyList.innerHTML = `<div class="empty-note">Chưa có lượt luyện tập nào được ghi nhận.</div>`;
      return;
    }
    const sorted = [...history].sort((a,b)=> b.timestamp - a.timestamp);
    historyList.innerHTML = sorted.map(h=>`
      <div class="hist-item">
        <div class="hist-main">
          <div class="hist-question">${escapeHtml(h.question)}</div>
          <div class="hist-meta">${formatDateTime(h.timestamp)} · ${h.duration}s</div>
        </div>
        <span class="badge ${h.result}">${h.result === "completed" ? "Hoàn thành" : "Bỏ qua"}</span>
      </div>
    `).join("");
  }

  clearHistoryBtn.addEventListener("click", ()=>{
    if(history.length === 0) return;
    if(confirm("Xóa toàn bộ lịch sử luyện tập?")){
      history = [];
      saveHistory(history);
      renderHistory();
    }
  });

  /* ---------------- Report tab ---------------- */
  const reportSummary = document.getElementById("reportSummary");
  const reportTableWrap = document.getElementById("reportTableWrap");

  function renderReport(){
    const totalCompleted = history.filter(h=>h.result==="completed").length;
    const totalSkipped = history.filter(h=>h.result==="skipped").length;

    reportSummary.innerHTML = `
      <div class="summary-card">
        <div class="summary-num">${history.length}</div>
        <div class="summary-label">Tổng lượt luyện tập</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${totalCompleted}</div>
        <div class="summary-label">Hoàn thành</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${totalSkipped}</div>
        <div class="summary-label">Bỏ qua</div>
      </div>
    `;

    if(history.length === 0){
      reportTableWrap.innerHTML = `<div class="empty-note">Chưa có dữ liệu để thống kê.</div>`;
      return;
    }

    const groups = {};
    history.forEach(h=>{
      const key = h.question;
      if(!groups[key]){
        groups[key] = { question: h.question, completed: 0, skipped: 0, last: 0 };
      }
      if(h.result === "completed") groups[key].completed += 1;
      else groups[key].skipped += 1;
      if(h.timestamp > groups[key].last) groups[key].last = h.timestamp;
    });

    const rows = Object.values(groups).sort((a,b)=>{
      const totalA = a.completed + a.skipped, totalB = b.completed + b.skipped;
      if(totalB !== totalA) return totalB - totalA;
      return b.completed - a.completed;
    });

    const maxCompleted = Math.max(1, ...rows.map(r=>r.completed));

    reportTableWrap.innerHTML = `
      <table class="report-table">
        <thead>
          <tr>
            <th>Câu hỏi</th>
            <th style="text-align:center;">Hoàn thành</th>
            <th style="text-align:center;">Bỏ qua</th>
            <th>Lần cuối</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="q-cell">
                ${escapeHtml(r.question)}
                <div class="bar-track"><div class="bar-fill" style="width:${(r.completed/maxCompleted*100).toFixed(0)}%"></div></div>
              </td>
              <td class="num-cell">${r.completed}</td>
              <td class="num-cell">${r.skipped}</td>
              <td>${formatDateTime(r.last)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  /* ---------------- Init ---------------- */
  fUploadDate.value = todayISO();
  updateTimerDisplay();
  renderList();
  renderReveal();

})();
</script>

</body>
</html>
