<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luyện nói</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5efe1;
    --bg-soft: #fbf7ec;
    --sidebar-bg: #2a2420;
    --sidebar-active: #3c332b;
    --sidebar-text: #cabfae;
    --sidebar-text-dim: #8f8575;
    --line: #e3d7bb;
    --line-strong: #d5c49c;
    --ink: #2a2420;
    --ink-dim: #7d7364;
    --ink-faint: #a89d89;
    --gold: #a97d3f;
    --gold-soft: #f0e0bc;
    --gold-dim: #c9ab74;
    --dark: #221d19;
    --red: #ac4d3a;
    --red-soft: #f4ddd6;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Work Sans', system-ui, sans-serif;
    --serif: 'Playfair Display', Georgia, serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    min-height: 100vh;
  }
  ::selection{ background: var(--gold-soft); color: var(--ink); }

  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  button{
    font-family: inherit;
    cursor: pointer;
  }

  /* ---------- App shell ---------- */
  .app-shell{
    display: flex;
    min-height: 100vh;
  }

  .sidebar{
    width: 246px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
  }
  .brand-name{
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.16em;
    font-weight: 600;
    color: #e8ddc9;
  }
  .brand-rule{
    height: 2px;
    width: 56px;
    background: var(--gold-dim);
    margin: 16px 0 28px;
  }
  .side-nav{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .nav-item{
    display: flex;
    align-items: center;
    gap: 11px;
    background: none;
    border: none;
    color: var(--sidebar-text);
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-family: var(--sans);
    line-height: 1.3;
  }
  .nav-item .nav-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    flex-shrink: 0;
  }
  .nav-item:hover{
    background: rgba(255,255,255,0.05);
    color: #e8ddc9;
  }
  .nav-item.active{
    background: var(--sidebar-active);
    color: var(--gold-dim);
    font-weight: 600;
  }
  .nav-item.active .nav-dot{
    background: var(--gold-dim);
    border-color: var(--gold-dim);
  }
  .nav-count{
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    opacity: 0.75;
    flex-shrink: 0;
  }

  .content{
    flex: 1;
    min-width: 0;
    padding: 44px 52px 110px;
    max-width: 920px;
  }

  .page-header{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 32px;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .page-title{
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    line-height: 1.1;
  }
  .btn-dark-pill{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-dark-pill:hover{ background: #33291f; }

  @media (max-width: 860px){
    .app-shell{ flex-direction: column; }
    .sidebar{
      width: 100%;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      padding: 16px 20px;
    }
    .brand-rule{ display: none; }
    .side-nav{
      flex-direction: row;
      overflow-x: auto;
      gap: 6px;
    }
    .nav-item{ padding: 9px 12px; font-size: 13.5px; white-space: nowrap; }
    .content{ padding: 28px 20px 90px; }
    .page-title{ font-size: 28px; }
  }

  .view{ display: none; }
  .view.active{ display: block; }

  /* ---------- Questions / Follow-up tab ---------- */
  .panel{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }

  .panel + .panel{ margin-top: 18px; }

  .field{ margin-bottom: 16px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .field textarea, .field input[type="text"]{
    width: 100%;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .field textarea{ min-height: 56px; }
  .field textarea:focus, .field input:focus{
    border-color: var(--gold);
  }

  .row2{
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
  }
  @media (max-width: 560px){
    .row2{ grid-template-columns: 1fr; }
  }

  .row2-even{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 560px){
    .row2-even{ grid-template-columns: 1fr; }
  }
  .field input[type="date"]{
    width: 100%;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--ink);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
  }
  .field input[type="date"]:focus{ border-color: var(--gold); }

  .support-item{
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 14px 14px 4px;
    margin-bottom: 10px;
    position: relative;
  }
  .support-item .remove-support{
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
  }
  .support-item .remove-support:hover{ color: var(--red); }

  .add-support-btn{
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 7px 16px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .add-support-btn:hover{ background: var(--gold-soft); }

  .form-actions{
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-primary{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary:hover{ background: #33291f; }
  .btn-ghost{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 11px 18px;
    font-size: 14px;
  }
  .btn-ghost:hover{ color: var(--ink); border-color: var(--ink-faint); }

  .qlist-title{
    font-size: 12px;
    color: var(--ink-faint);
    margin: 0;
    letter-spacing: 0.02em;
  }

  .list-toolbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 26px 0 10px;
  }
  .list-controls{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tag-search-wrap{
    position: relative;
  }
  .tag-search-wrap input{
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    min-width: 190px;
  }
  .tag-search-wrap input:focus{ border-color: var(--gold); }
  .tag-dropdown{
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 24px rgba(42,36,32,0.14);
    max-height: 190px;
    overflow-y: auto;
    z-index: 30;
  }
  .tag-dropdown.open{ display: block; }
  .tag-option{
    padding: 8px 14px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .tag-option:hover{ background: var(--gold-soft); color: var(--ink); }
  .sort-btn{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 13px;
    white-space: nowrap;
  }
  .sort-btn:hover{ border-color: var(--ink-faint); color: var(--ink); }

  .qcard{
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--bg-soft);
  }
  .qcard-head{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 14px;
  }
  .qcard-date{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    min-width: 46px;
  }
  .qcard-q{
    font-size: 14px;
    color: var(--ink);
    flex: 1 1 200px;
    min-width: 150px;
    cursor: pointer;
  }
  .qcard-tags{
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex-shrink: 0;
    max-width: 240px;
    justify-content: flex-end;
  }
  .tag-chip{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-pill);
    padding: 2px 9px;
    white-space: nowrap;
  }
  .qcard-actions{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn{
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 4px 7px;
    border-radius: 6px;
  }
  .icon-btn:hover{ color: var(--ink); background: var(--line); }
  .icon-btn.danger:hover{ color: var(--red); }

  .qcard-body{
    display: none;
    padding: 14px;
    font-size: 13px;
    color: var(--ink-dim);
    border-top: 1px solid var(--line);
  }
  .qcard-body.open{ display: block; }
  .qcard-body .block{ margin-bottom: 12px; }
  .qcard-body .block:last-child{ margin-bottom: 0; }
  .block-label{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .chip{
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid var(--gold-dim);
    border-radius: var(--radius-pill);
    padding: 2px 10px;
    margin: 0 4px 4px 0;
  }
  .ref-text{ color: var(--ink); white-space: pre-wrap; }

  .empty-note{
    color: var(--ink-faint);
    font-size: 13px;
    padding: 20px 4px;
    text-align: center;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
  }

  /* ---------- Practice tab ---------- */
  .practice-subtabs{
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 32px;
  }
  .subtab-btn{
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 9px 22px;
    font-size: 14px;
    font-weight: 500;
  }
  .subtab-btn.active{
    background: var(--dark);
    color: #f5efe1;
    border-color: var(--dark);
  }
  .practice-pane{ display: none; }
  .practice-pane.active{ display: block; }

  .stage{
    text-align: center;
    padding: 10px 0 6px;
  }

  .stage-question{
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-soft);
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 26px;
  }
  .stage-question.placeholder{ color: var(--ink-faint); font-size: 14px; }

  .stage-actions{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 34px;
  }
  .random-btn{
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
  }
  .random-btn:hover{ background: var(--gold-soft); }
  .random-btn:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .stage-edit-btn{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 500;
  }
  .stage-edit-btn:hover{ border-color: var(--ink-faint); color: var(--ink); }
  .stage-edit-btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .timer-display{
    font-family: var(--mono);
    font-weight: 600;
    font-size: clamp(64px, 18vw, 108px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 30px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
  }
  .timer-display.warn{ color: var(--gold); }
  .timer-display.done{ color: var(--red); }

  .duration-group{
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .duration-btn{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 9px 20px;
    font-size: 14px;
  }
  .duration-btn.active{
    background: var(--dark);
    color: #f5efe1;
    border-color: var(--dark);
  }
  .duration-btn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .control-group{
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .btn-start{
    background: var(--dark);
    color: #f5efe1;
    border: none;
    border-radius: var(--radius-pill);
    padding: 13px 36px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-start:hover{ background: #33291f; }
  .btn-start:disabled{ opacity: 0.35; cursor: not-allowed; background: var(--dark); }

  .btn-stop{
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: var(--radius-pill);
    padding: 13px 36px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-stop:hover{ background: var(--red-soft); }
  .btn-stop:disabled{ opacity: 0.35; cursor: not-allowed; }

  .status-line{
    text-align:center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 18px;
    min-height: 16px;
  }

  .divider{
    border: none;
    border-top: 1px solid var(--line);
    margin: 34px 0 26px;
  }

  .hint-section{
    text-align: left;
  }
  .hint-buttons{
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .btn-hint{
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 9px 18px;
    font-size: 13px;
  }
  .btn-hint:hover{ border-color: var(--ink-faint); color: var(--ink); }
  .btn-hint.active{ border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .btn-hint:disabled{ opacity: 0.4; cursor: not-allowed; }

  .reveal-area{
    max-width: 560px;
    margin: 0 auto;
  }
  .reveal-item{
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--bg-soft);
    text-align: left;
  }
  .reveal-item .block-label{ margin-bottom: 6px; }
  .reveal-item .ref-text{
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-dim);
  }

  .finish-group{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }
  .btn-complete{
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-complete:hover{ background: var(--gold-soft); }
  .btn-complete:disabled{ opacity: 0.35; cursor: not-allowed; }
  .btn-skip{
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--ink-dim);
    border-radius: var(--radius-pill);
    padding: 10px 22px;
    font-size: 14px;
  }
  .btn-skip:hover{ color: var(--ink); border-color: var(--ink-faint); }
  .btn-skip:disabled{ opacity: 0.35; cursor: not-allowed; }

  /* ---------- History tab ---------- */
  .streak-panel{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px 20px;
    margin-bottom: 22px;
  }
  .streak-grid-wrap{
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .streak-months{
    position: relative;
    height: 14px;
    margin: 0 0 6px 30px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .streak-months span{ position: absolute; white-space: nowrap; }
  .streak-grid-row{
    display: flex;
    gap: 6px;
  }
  .streak-daylabels{
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 24px;
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-faint);
  }
  .streak-daylabels span{ height: 13px; line-height: 13px; }
  .streak-grid{
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 13px);
    gap: 3px;
  }
  .streak-cell{
    width: 13px;
    height: 13px;
    border-radius: 3px;
    background: #fff;
    border: 1px solid var(--line-strong);
  }
  .streak-cell.done{
    background: var(--gold);
    border-color: var(--gold);
  }
  .streak-cell.future{
    background: transparent;
    border: 1px dashed var(--line);
  }
  .streak-cell.today{
    box-shadow: 0 0 0 1.5px var(--ink-dim);
  }
  .streak-stats{
    display: flex;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .streak-stat-card{
    flex: 1;
    min-width: 170px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }
  .streak-stat-num{
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
  }
  .streak-stat-label{
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .intensity-panel{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px 18px;
    margin-bottom: 22px;
  }
  .intensity-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  .intensity-title{
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .intensity-legend{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--ink-faint);
    font-family: var(--mono);
  }
  .legend-swatch{
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .legend-swatch.lvl0, .intensity-bar.lvl0{ background: var(--line); }
  .legend-swatch.lvl1, .intensity-bar.lvl1{ background: #eccf98; }
  .legend-swatch.lvl2, .intensity-bar.lvl2{ background: #dfae65; }
  .legend-swatch.lvl3, .intensity-bar.lvl3{ background: #c98a3c; }
  .legend-swatch.lvl4, .intensity-bar.lvl4{ background: #a15f22; }

  .intensity-scroll{
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .intensity-bars{
    display: flex;
    gap: 4px;
    height: 90px;
    align-items: stretch;
  }
  .intensity-bar{
    flex: 0 0 32px;
    width: 32px;
    border-radius: 3px;
  }
  .intensity-bar.future{ background: transparent; }

  .intensity-daylabels{
    display: flex;
    gap: 4px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .intensity-daylabels span{
    flex: 0 0 32px;
    width: 32px;
    text-align: center;
    white-space: nowrap;
  }

  .history-toolbar{
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .hist-item{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .hist-main{ flex: 1; min-width: 0; }
  .hist-question{
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .hist-meta{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .hist-badges{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .badge{
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .badge.completed{
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    background: var(--gold-soft);
  }
  .badge.skipped{
    color: var(--ink-faint);
    border: 1px solid var(--line-strong);
  }
  .badge.type-question{
    color: var(--ink-dim);
    border: 1px solid var(--line-strong);
    background: #fff;
  }
  .badge.type-followup{
    color: #7a6a8a;
    border: 1px solid #c9b8d6;
    background: #f1e9f6;
  }

  /* ---------- Report tab ---------- */
  .report-columns{
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .report-columns .report-section{
    flex: 1;
    min-width: 0;
    margin-bottom: 0;
  }
  @media (max-width: 760px){
    .report-columns{ flex-direction: column; }
    .report-columns .report-section{ width: 100%; }
  }
  .report-section-title{
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .report-summary{
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .summary-card{
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
    background: var(--bg-soft);
  }
  .summary-num{
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
  }
  .summary-label{
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .report-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .report-table th{
    text-align: left;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--ink-faint);
    font-weight: 500;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .report-table td{
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
    vertical-align: top;
  }
  .report-table tr:last-child td{ border-bottom: none; }
  .report-table td.q-cell{ color: var(--ink); }
  .report-table td.num-cell{
    font-family: var(--mono);
    text-align: center;
  }
  .bar-track{
    background: var(--line);
    border-radius: var(--radius-pill);
    height: 5px;
    margin-top: 6px;
    overflow: hidden;
  }
  .bar-fill{
    background: var(--gold);
    height: 100%;
  }
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">

          </div>

          <div class="field">
            <label>Tag &amp; ngày upload</label>

              <input type="text" id="fTag" placeholder="Tag, phân cách bằng dấu phẩy" />

            </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="saveBtn">Lưu câu hỏi</button>
            <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none;">Hủy chỉnh sửa</button>

      </div>

      <div class="list-toolbar">
        <div class="qlist-title">Danh sách đã lưu</div>

      </div>
      <div id="qList"></div>

    </div>

    <!-- ================= FOLLOW-UP QUESTION TAB ================= -->
    <div class="view" id="view-followup">

      <div class="panel">
        <form id="fuForm">
          <div class="field">
            <label for="fStatement">Thêm nhận định</label>
            <textarea id="fStatement" required placeholder="Nhập nhận định..."></textarea>
          </div>

          <div class="field">
            <label for="fFramework">Follow-up question — Framework</label>
            <textarea id="fFramework" placeholder="Khung tư duy / framework để trả lời follow-up..."></textarea>
          </div>

          <div class="field">
            <label for="fCommonQ">Follow-up question — Câu hỏi thông thường</label>
            <textarea id="fCommonQ" placeholder="Những câu hỏi thường gặp..."></textarea>
          </div>

          <div class="field">
            <label for="fLikelyAnswer">Follow-up question — Câu trả lời rất có thể nhận lại được</label>
            <textarea id="fLikelyAnswer" placeholder="Câu trả lời khả năng cao sẽ nhận được..."></textarea>
          </div>

          <div class="field">
            <label for="fBetter">Follow-up question — Ta có thể làm tốt hơn</label>
            <textarea id="fBetter" placeholder="Điều có thể trả lời tốt hơn..."></textarea>
          </div>

          <div class="field">
            <label>Tag &amp; ngày tạo</label>
            <div class="row2-even">
              <input type="text" id="fFuTag" placeholder="Tag, phân cách bằng dấu phẩy" />
              <input type="date" id="fFuDate" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="fuSaveBtn">Lưu nhận định</button>
            <button type="button" class="btn-ghost" id="fuCancelEditBtn" style="display:none;">Hủy chỉnh sửa</button>
          </div>
        </form>
      </div>

      <div class="list-toolbar">
        <div class="qlist-title">Danh sách đã lưu</div>
        <div class="list-controls">
          <div class="tag-search-wrap">
            <input type="text" id="fuTagSearchInput" placeholder="Tìm theo tag..." autocomplete="off" />
            <div class="tag-dropdown" id="fuTagDropdown"></div>
          </div>
          <button type="button" class="sort-btn" id="fuSortBtn">Ngày tạo: Mới nhất ↓</button>
        </div>
      </div>
      <div id="fuList"></div>

    </div>

    <!-- ================= PRACTICE TAB ================= -->
    <div class="view" id="view-practice">

      <div class="practice-subtabs">
        <button class="subtab-btn active" data-pane="q">Câu hỏi</button>
        <button class="subtab-btn" data-pane="followup">Follow-up question</button>
      </div>

      <div class="practice-pane active" id="pane-q">
        <div class="stage">
          <div class="stage-question placeholder" id="stageQuestion">Bấm "Random câu hỏi" để bắt đầu</div>

          <div class="stage-actions">
            <button class="random-btn" id="randomBtn">🎲 Random câu hỏi</button>
            <button class="stage-edit-btn" id="editQBtn" disabled>✎ Sửa</button>
          </div>

          <div class="timer-display" id="timerDisplay">07</div>

          <div class="duration-group" id="durationGroup">
            <button class="duration-btn active" data-secs="7">7s</button>
            <button class="duration-btn" data-secs="15">15s</button>
            <button class="duration-btn" data-secs="30">30s</button>
          </div>

          <div class="control-group">
            <button class="btn-start" id="startBtn">Bắt đầu</button>
            <button class="btn-stop" id="stopBtn" disabled>Dừng</button>
          </div>

          <div class="status-line" id="statusLine"></div>

          <hr class="divider" />

          <div class="hint-section">
            <div class="hint-buttons">
              <button class="btn-hint" id="keywordBtn" disabled>Xem key words</button>
              <button class="btn-hint" id="samplesBtn" disabled>Xem samples</button>
            </div>
            <div class="reveal-area" id="revealArea"></div>
          </div>

          <div class="finish-group">
            <button class="btn-complete" id="completeBtn" disabled>✓ Hoàn thành luyện tập</button>
            <button class="btn-skip" id="skipBtn" disabled>Bỏ qua</button>
          </div>
        </div>
      </div>

      <div class="practice-pane" id="pane-followup">
        <div class="stage">
          <div class="stage-question placeholder" id="fuStageStatement">Bấm "Random nhận định" để bắt đầu</div>

          <div class="stage-actions">
            <button class="random-btn" id="fuRandomBtn">🎲 Random nhận định</button>
            <button class="stage-edit-btn" id="fuEditBtn" disabled>✎ Sửa</button>
          </div>

          <div class="timer-display" id="fuTimerDisplay">07</div>

          <div class="duration-group" id="fuDurationGroup">
            <button class="duration-btn active" data-secs="7">7s</button>
            <button class="duration-btn" data-secs="15">15s</button>
            <button class="duration-btn" data-secs="30">30s</button>
          </div>

          <div class="control-group">
            <button class="btn-start" id="fuStartBtn">Bắt đầu</button>
            <button class="btn-stop" id="fuStopBtn" disabled>Dừng</button>
          </div>

          <div class="status-line" id="fuStatusLine"></div>

          <hr class="divider" />

          <div class="hint-section">
            <div class="hint-buttons">
              <button class="btn-hint" id="fuRevealBtn" disabled>Hiện Framework</button>
            </div>
            <div class="reveal-area" id="fuRevealArea"></div>
          </div>

          <div class="finish-group">
            <button class="btn-complete" id="fuCompleteBtn" disabled>✓ Hoàn thành luyện tập</button>
            <button class="btn-skip" id="fuSkipBtn" disabled>Bỏ qua</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= HISTORY TAB ================= -->
    <div class="view" id="view-history">
      <div class="streak-panel">
        <div class="streak-grid-wrap">
          <div class="streak-months" id="streakMonths"></div>
          <div class="streak-grid-row">
            <div class="streak-daylabels" id="streakDayLabels"></div>
            <div class="streak-grid" id="streakGrid"></div>
          </div>
        </div>
        <div class="streak-stats">
          <div class="streak-stat-card">
            <div class="streak-stat-num" id="currentStreakNum">0</div>
            <div class="streak-stat-label">🔥 Streak hiện tại (ngày liên tiếp)</div>
          </div>
          <div class="streak-stat-card">
            <div class="streak-stat-num" id="longestStreakNum">0</div>
            <div class="streak-stat-label" id="longestStreakRange">Streak dài nhất</div>
          </div>

            <span class="legend-swatch lvl0"></span>
            <span class="legend-swatch lvl1"></span>
            <span class="legend-swatch lvl2"></span>
            <span class="legend-swatch lvl3"></span>
            <span class="legend-swatch lvl4"></span>
            <span>Nhiều hơn</span>
          </div>

    <!-- ================= REPORT TAB ================= -->
    <div class="view" id="view-report">
      <div class="report-columns">
        <div class="report-section">
          <h2 class="report-section-title">Câu hỏi</h2>
          <div class="report-summary" id="reportSummaryQ"></div>
          <div id="reportTableWrapQ"></div>
        </div>

        <div class="report-section">
          <h2 class="report-section-title">Follow-up question</h2>
          <div class="report-summary" id="reportSummaryFu"></div>
          <div id="reportTableWrapFu"></div>
        </div>
      </div>
    </div>

  </main>

</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "speech-practice-questions-v1";

  /* ---------------- Data layer: questions ---------------- */
  function loadQuestions(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Không đọc được dữ liệu đã lưu:", e);
      return [];
    }
  }
  function saveQuestions(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){
      console.error("Không lưu được dữ liệu:", e);
      alert("Không thể lưu dữ liệu (bộ nhớ trình duyệt có thể đã đầy hoặc bị chặn).");
    }
  }

  let questions = loadQuestions();
  let editingId = null;

  /* ---------------- Data layer: follow-up nhận định ---------------- */
  const FOLLOWUP_KEY = "speech-practice-followups-v1";
  function loadFollowups(){
    try{
      const raw = localStorage.getItem(FOLLOWUP_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Không đọc được dữ liệu nhận định:", e);
      return [];
    }
  }
  function saveFollowups(list){
    try{
      localStorage.setItem(FOLLOWUP_KEY, JSON.stringify(list));
    }catch(e){
      console.error("Không lưu được dữ liệu nhận định:", e);
      alert("Không thể lưu dữ liệu (bộ nhớ trình duyệt có thể đã đầy hoặc bị chặn).");
    }
  }

  let followups = loadFollowups();
  let fuEditingId = null;

  /* ---------------- Data layer: history ---------------- */
  const HISTORY_KEY = "speech-practice-history-v1";
  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Không đọc được lịch sử:", e);
      return [];
    }
  }
  function saveHistory(list){
    try{
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    }catch(e){
      console.error("Không lưu được lịch sử:", e);
    }
  }
  let history = loadHistory();

  /* ---------------- Helpers ---------------- */
  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function todayISO(){
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function formatDateStr(s){
    if(!s) return "—";
    const parts = s.split("-");
    if(parts.length !== 3) return s;
    return `${parts[2]}/${parts[1]}`;
  }

  /* ---------------- Tabs / page header ---------------- */
  const pageHeaders = {
    questions: { eyebrow: "BỘ CÂU HỎI CỦA BẠN", title: "Câu hỏi", action: true, actionLabel: "+ Thêm câu hỏi" },
    followup: { eyebrow: "THƯ VIỆN NHẬN ĐỊNH", title: "Follow-up question", action: true, actionLabel: "+ Thêm nhận định" },
    practice: { eyebrow: "CHẾ ĐỘ LUYỆN TẬP", title: "Luyện tập", action: false },
    history: { eyebrow: "NHẬT KÝ LUYỆN TẬP", title: "Lịch sử", action: false },
    report: { eyebrow: "THỐNG KÊ", title: "Báo cáo", action: false }
  };

  let activeTabKey = "questions";

  const pageEyebrow = document.getElementById("pageEyebrow");
  const pageTitle = document.getElementById("pageTitle");
  const headerActionBtn = document.getElementById("headerActionBtn");

  const tabBtns = document.querySelectorAll(".nav-item");
  const views = {
    questions: document.getElementById("view-questions"),
    followup: document.getElementById("view-followup"),
    practice: document.getElementById("view-practice"),
    history: document.getElementById("view-history"),
    report: document.getElementById("view-report")
  };

  function activateTab(tabKey){
    activeTabKey = tabKey;
    tabBtns.forEach(b=> b.classList.toggle("active", b.dataset.tab === tabKey));
    Object.entries(views).forEach(([key, el])=> el.classList.toggle("active", key === tabKey));
    const h = pageHeaders[tabKey];
    pageEyebrow.textContent = h.eyebrow;
    pageTitle.textContent = h.title;
    headerActionBtn.style.display = h.action ? "inline-block" : "none";
    headerActionBtn.textContent = h.actionLabel || "";
    if(tabKey === "followup") renderFollowupList();
    if(tabKey === "history"){ renderHistory(); renderStreak(); renderIntensity(); }
    if(tabKey === "report") renderReport();
  }

  tabBtns.forEach(btn=>{
    btn.addEventListener("click", ()=> activateTab(btn.dataset.tab));
  });

  headerActionBtn.addEventListener("click", ()=>{
    if(activeTabKey === "followup"){
      resetFollowupForm();
      document.getElementById("fStatement").focus();
    } else {
      resetForm();
      document.getElementById("fQuestion").focus();
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ==================================================================
     QUESTIONS TAB
  ================================================================== */

  const supportListEl = document.getElementById("supportList");
  const addSupportBtn = document.getElementById("addSupportBtn");

  function makeSupportRow(data){
    data = data || { keyword: "", ref: "" };
    const row = document.createElement("div");
    row.className = "support-item";
    row.innerHTML = `
      <button type="button" class="remove-support" aria-label="Xóa ý support">×</button>
      <div class="row2">
        <input type="text" class="sup-keyword" placeholder="Từ khóa" value="${escapeAttr(data.keyword)}" />
        <textarea class="sup-ref" placeholder="Gợi ý tham khảo">${escapeHtml(data.ref)}</textarea>
      </div>
    `;
    row.querySelector(".remove-support").addEventListener("click", ()=> row.remove());
    supportListEl.appendChild(row);
  }

  addSupportBtn.addEventListener("click", ()=> makeSupportRow());

  const qForm = document.getElementById("qForm");
  const fQuestion = document.getElementById("fQuestion");
  const fCoreKeyword = document.getElementById("fCoreKeyword");
  const fCoreRef = document.getElementById("fCoreRef");
  const fTag = document.getElementById("fTag");
  const fUploadDate = document.getElementById("fUploadDate");
  const saveBtn = document.getElementById("saveBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");

  function resetForm(){

    fuStageStatement.textContent = pick.statement;
    fuStageStatement.classList.remove("placeholder");
    fuLoadRevealSequence(pick);
    fuCompleteBtn.disabled = false;
    fuSkipBtn.disabled = false;
    fuEditBtn.disabled = false;
    fuStatusLine.textContent = "";
  });

  function fuBuildSequence(f){
    const seq = [];
    if(f.framework) seq.push({ label: "Framework", content: f.framework });
    if(f.commonQuestions) seq.push({ label: "Câu hỏi thông thường", content: f.commonQuestions });
    if(f.likelyAnswer) seq.push({ label: "Câu trả lời rất có thể nhận lại được", content: f.likelyAnswer });
    if(f.betterApproach) seq.push({ label: "Ta có thể làm tốt hơn", content: f.betterApproach });
    return seq;
  }

  function fuLoadRevealSequence(f){
    fuRevealSequence = fuBuildSequence(f);
    fuRevealedCount = 0;
    fuRenderReveal();
  }

  function fuRenderReveal(){
    const total = fuRevealSequence.length;

    if(total === 0){
      fuRevealBtn.disabled = true;
      fuRevealBtn.textContent = "Hiện Framework";
      fuRevealArea.innerHTML = "";
      return;
    }

    if(fuRevealedCount >= total){
      fuRevealBtn.disabled = true;
      fuRevealBtn.textContent = "Đã hiện hết";
    } else {
      fuRevealBtn.disabled = false;
      fuRevealBtn.textContent = "Hiện " + fuRevealSequence[fuRevealedCount].label;
    }

    fuRevealArea.innerHTML = "";
    for(let i=0; i<fuRevealedCount; i++){
      const item = fuRevealSequence[i];
      const div = document.createElement("div");
      div.className = "reveal-item";
      div.innerHTML = `
        <div class="block-label">${escapeHtml(item.label)}</div>
        <div class="ref-text">${escapeHtml(item.content)}</div>
      `;
      fuRevealArea.appendChild(div);
    }
  }

  fuRevealBtn.addEventListener("click", ()=>{
    if(fuRevealedCount >= fuRevealSequence.length) return;
    fuRevealedCount += 1;
    fuRenderReveal();
  });

  function fuLogAttempt(result){
    if(!currentFollowup) return;
    history.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      type: "followup",
      questionId: currentFollowup.id,
      question: currentFollowup.statement,
      duration: fuSelectedDuration,
      result: result,
      timestamp: Date.now()
    });
    saveHistory(history);

    if(fuIntervalId){
      clearInterval(fuIntervalId);
      fuIntervalId = null;
    }
    fuSetRunningState(false);
    fuRemaining = fuSelectedDuration;
    fuUpdateTimerDisplay();

    currentFollowup = null;
    fuStageStatement.textContent = "Bấm \"Random nhận định\" để tiếp tục";
    fuStageStatement.classList.add("placeholder");
    fuCompleteBtn.disabled = true;
    fuSkipBtn.disabled = true;
    fuEditBtn.disabled = true;
    fuLoadRevealSequence({ framework:"", commonQuestions:"", likelyAnswer:"", betterApproach:"" });
    fuStatusLine.textContent = result === "completed" ? "Đã ghi nhận: Hoàn thành." : "Đã ghi nhận: Bỏ qua.";
  }

  fuCompleteBtn.addEventListener("click", ()=> fuLogAttempt("completed"));
  fuSkipBtn.addEventListener("click", ()=> fuLogAttempt("skipped"));
  fuEditBtn.addEventListener("click", ()=>{
    if(currentFollowup) startFuEdit(currentFollowup.id);
  });

  function fuSetRunningState(running){
    fuStartBtn.disabled = running;
    fuStopBtn.disabled = !running;
    fuRandomBtn.disabled = running;
    fuDurationBtns.forEach(b=> b.disabled = running);
  }

  fuStartBtn.addEventListener("click", ()=>{
    if(fuIntervalId) return;
    fuRemaining = fuSelectedDuration;
    fuUpdateTimerDisplay();
    fuSetRunningState(true);
    fuStatusLine.textContent = "Đang nói...";

    fuIntervalId = setInterval(()=>{
      fuRemaining -= 1;
      fuUpdateTimerDisplay();
      if(fuRemaining <= 0){
        clearInterval(fuIntervalId);
        fuIntervalId = null;
        fuSetRunningState(false);
        fuStatusLine.textContent = "Hết giờ.";
      }
    }, 1000);
  });

  fuStopBtn.addEventListener("click", ()=>{
    if(fuIntervalId){
      clearInterval(fuIntervalId);
      fuIntervalId = null;
    }
    fuRemaining = fuSelectedDuration;
    fuUpdateTimerDisplay();
    fuSetRunningState(false);
    fuStatusLine.textContent = "Đã dừng.";
  });

  /* ---------------- Phím tắt: Enter = Hoàn thành ---------------- */
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    if(!views.practice.classList.contains("active")) return;

    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;

    e.preventDefault();
    if(practicePanes.q.classList.contains("active")){
      if(!completeBtn.disabled) completeBtn.click();
    } else if(practicePanes.followup.classList.contains("active")){
      if(!fuCompleteBtn.disabled) fuCompleteBtn.click();
    }
  });

  /* ==================================================================
     HISTORY TAB
  ================================================================== */
  const historyList = document.getElementById("historyList");
  const clearHistoryBtn = document.getElementById("clearHistoryBtn");

  function formatDateTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function typeLabel(type){
    return type === "followup" ? "Nhận định" : "Câu hỏi";
  }

  function renderHistory(){
    if(history.length === 0){
      historyList.innerHTML = `<div class="empty-note">Chưa có lượt luyện tập nào được ghi nhận.</div>`;
      return;
    }
    const sorted = [...history].sort((a,b)=> b.timestamp - a.timestamp);
    historyList.innerHTML = sorted.map(h=>`
      <div class="hist-item">
        <div class="hist-main">
          <div class="hist-question">${escapeHtml(h.question)}</div>
          <div class="hist-meta">${formatDateTime(h.timestamp)} · ${h.duration}s</div>
        </div>
        <div class="hist-badges">
          <span class="badge type-${h.type||'question'}">${typeLabel(h.type)}</span>
          <span class="badge ${h.result}">${h.result === "completed" ? "Hoàn thành" : "Bỏ qua"}</span>
        </div>
      </div>
    `).join("");
  }

  /* ---------------- Streak (heatmap) ---------------- */
  const streakGrid = document.getElementById("streakGrid");
  const streakMonths = document.getElementById("streakMonths");
  const streakDayLabels = document.getElementById("streakDayLabels");
  const currentStreakNum = document.getElementById("currentStreakNum");
  const longestStreakNum = document.getElementById("longestStreakNum");
  const longestStreakRange = document.getElementById("longestStreakRange");

  const WEEKS_SHOWN = 18;
  const MONTH_NAMES = ["Th1","Th2","Th3","Th4","Th5","Th6","Th7","Th8","Th9","Th10","Th11","Th12"];

  function tsToISO(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function isoToDate(iso){
    return new Date(iso + "T00:00:00");
  }

  function mondayIndex(date){
    return (date.getDay() + 6) % 7;
  }

  function getCompletedDateSet(){
    const set = new Set();
    history.forEach(h=>{
      if(h.result === "completed") set.add(tsToISO(h.timestamp));
    });
    return set;
  }

  function computeCurrentStreak(dateSet){
    const today = new Date();
    today.setHours(0,0,0,0);
    const cursor = new Date(today);
    const pad = n => String(n).padStart(2, "0");
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

    if(!dateSet.has(iso(cursor))){
      cursor.setDate(cursor.getDate() - 1);
    }
    let streak = 0;
    while(dateSet.has(iso(cursor))){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function computeLongestStreak(dateSet){
    const dates = Array.from(dateSet).sort();
    if(dates.length === 0) return { length: 0, start: null, end: null };

    let best = { length: 1, start: dates[0], end: dates[0] };
    let curLen = 1, curStart = dates[0], prev = isoToDate(dates[0]);

    for(let i=1; i<dates.length; i++){
      const d = isoToDate(dates[i]);
      const diffDays = Math.round((d - prev) / 86400000);
      if(diffDays === 1){
        curLen++;
      } else {
        if(curLen > best.length){ best = { length: curLen, start: curStart, end: dates[i-1] }; }
        curLen = 1;
        curStart = dates[i];
      }
      prev = d;
    }
    if(curLen > best.length){ best = { length: curLen, start: curStart, end: dates[dates.length-1] }; }
    return best;
  }

  function formatIsoShort(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function renderStreak(){
    const dateSet = getCompletedDateSet();

    streakDayLabels.innerHTML = ["T2","","T4","","T6","",""].map(l=>`<span>${l}</span>`).join("");

    const today = new Date();
    today.setHours(0,0,0,0);
    const todayIso = tsToISO(today.getTime());

    const totalDays = WEEKS_SHOWN * 7;
    const startOffset = mondayIndex(today) + (WEEKS_SHOWN - 1) * 7;
    const startDate = new Date(today);
    startDate.setDate(startDate.getDate() - startOffset);

    let cellsHtml = "";
    const monthMarks = [];
    let lastMonth = null;

    for(let i=0; i<totalDays; i++){
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const iso = tsToISO(d.getTime());
      const col = Math.floor(i / 7);
      const row = i % 7;

      if(row === 0){
        const m = d.getMonth();
        if(m !== lastMonth){
          monthMarks.push({ col, label: MONTH_NAMES[m] });
          lastMonth = m;
        }
      }

      if(d > today){
        cellsHtml += `<div class="streak-cell future" title=""></div>`;
      } else {
        const done = dateSet.has(iso);
        const isToday = iso === todayIso;
        cellsHtml += `<div class="streak-cell${done ? " done" : ""}${isToday ? " today" : ""}" title="${iso}${done ? " · Đã luyện tập" : ""}"></div>`;
      }
    }
    streakGrid.innerHTML = cellsHtml;

    const cellStep = 16;
    streakMonths.innerHTML = monthMarks.map(m=>`<span style="left:${m.col * cellStep}px">${m.label}</span>`).join("");

    currentStreakNum.textContent = computeCurrentStreak(dateSet);
    const best = computeLongestStreak(dateSet);
    longestStreakNum.textContent = best.length;
    longestStreakRange.textContent = best.length > 0
      ? `Streak dài nhất · ${formatIsoShort(best.start)} – ${formatIsoShort(best.end)}`
      : "Streak dài nhất";
  }

  /* ---------------- Intensity heatmap ---------------- */
  const intensityBars = document.getElementById("intensityBars");
  const intensityDayLabels = document.getElementById("intensityDayLabels");
  const INTENSITY_DAYS = 20;

  function getDailyCounts(){
    const counts = {};
    history.forEach(h=>{
      const iso = tsToISO(h.timestamp);
      counts[iso] = (counts[iso] || 0) + 1;
    });
    return counts;
  }

  function bucketLevel(count){
    if(count <= 0) return 0;
    if(count === 1) return 1;
    if(count === 2) return 2;
    if(count === 3) return 3;
    return 4;
  }

  function renderIntensity(){
    const counts = getDailyCounts();
    const today = new Date();
    today.setHours(0,0,0,0);
    const startDate = new Date(today);
    startDate.setDate(startDate.getDate() - (INTENSITY_DAYS - 1));

    let barsHtml = "";
    let labelsHtml = "";

    for(let i=0; i<INTENSITY_DAYS; i++){
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const iso = tsToISO(d.getTime());
      const count = counts[iso] || 0;
      const lvl = bucketLevel(count);

      barsHtml += `<div class="intensity-bar lvl${lvl}" title="${iso} · ${count} lượt"></div>`;
      labelsHtml += `<span>${d.getDate()}/${d.getMonth()+1}</span>`;
    }

    intensityBars.innerHTML = barsHtml;
    intensityDayLabels.innerHTML = labelsHtml;
  }

  clearHistoryBtn.addEventListener("click", ()=>{
    if(history.length === 0) return;
    if(confirm("Xóa toàn bộ lịch sử luyện tập?")){
      history = [];
      saveHistory(history);
      renderHistory();
      renderStreak();
      renderIntensity();
    }
  });

  /* ==================================================================
     REPORT TAB
  ================================================================== */
  const reportSummaryQ = document.getElementById("reportSummaryQ");
  const reportTableWrapQ = document.getElementById("reportTableWrapQ");
  const reportSummaryFu = document.getElementById("reportSummaryFu");
  const reportTableWrapFu = document.getElementById("reportTableWrapFu");

  function renderReportSection(entries, summaryEl, tableEl, emptyLabel, colLabel){
    summaryEl.innerHTML = `
      <div class="summary-card">
        <div class="summary-num">${entries.length}</div>
        <div class="summary-label">Tổng lượt luyện tập</div>
      </div>
    `;

    if(entries.length === 0){
      tableEl.innerHTML = `<div class="empty-note">Chưa có dữ liệu ${emptyLabel} để thống kê.</div>`;
      return;
    }

    const groups = {};
    entries.forEach(h=>{
      const key = h.question;
      if(!groups[key]){
        groups[key] = { question: h.question, completed: 0, last: 0 };
      }
      if(h.result === "completed") groups[key].completed += 1;
      if(h.timestamp > groups[key].last) groups[key].last = h.timestamp;
    });

    const rows = Object.values(groups).sort((a,b)=>{
      if(b.completed !== a.completed) return b.completed - a.completed;
      return b.last - a.last;
    });

    const maxCompleted = Math.max(1, ...rows.map(r=>r.completed));

    tableEl.innerHTML = `
      <table class="report-table">
        <thead>
          <tr>
            <th>${colLabel}</th>
            <th style="text-align:center;">Hoàn thành</th>
            <th>Lần cuối</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="q-cell">
                ${escapeHtml(r.question)}
                <div class="bar-track"><div class="bar-fill" style="width:${(r.completed/maxCompleted*100).toFixed(0)}%"></div></div>
              </td>
              <td class="num-cell">${r.completed}</td>
              <td>${formatDateTime(r.last)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function renderReport(){
    const qEntries = history.filter(h => (h.type || "question") === "question");
    const fuEntries = history.filter(h => h.type === "followup");
    renderReportSection(qEntries, reportSummaryQ, reportTableWrapQ, "câu hỏi", "Câu hỏi");
    renderReportSection(fuEntries, reportSummaryFu, reportTableWrapFu, "nhận định", "Nhận định");
  }

  /* ---------------- Init ---------------- */
  fUploadDate.value = todayISO();
  fFuDate.value = todayISO();
  updateTimerDisplay();
  fuUpdateTimerDisplay();
  renderList();
  renderFollowupList();
  renderReveal();
  fuRenderReveal();

})();
</script>

</body>
</html>
